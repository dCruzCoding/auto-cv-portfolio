name: Construir Portfolio y CVs

# Se activa cuando haces un push a la rama 'main'
on:
  push:
    branches: [ main ]

# Permisos para que el bot pueda publicar en GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar tu código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Instalar librerías
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # 4. RESTAURAR DATOS PRIVADOS (Crea carpeta y archivo)
      - name: Restaurar datos privados
        env:
          YAML_CONTENT: ${{ secrets.DATA_YAML }}
        run: |
          mkdir -p data
          echo "$YAML_CONTENT" > data/info.yaml

      # 5. EJECUTAR TU SCRIPT (Genera .tex y .html en output)
      - name: Generar archivos con Python
        run: python script.py

      # 6. COMPILAR LATEX A PDF
      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: output/*.tex
          # Importante: para que encuentre imágenes u otros recursos si los añades luego
          work_in_root_file_dir: true 

      # 7. SUBIR PDFS PARA DESCARGAR (Artifacts)
      - name: Subir PDFs (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mis-cvs-pdf
          path: output/*.pdf

      # 8. PUBLICAR EN GITHUB PAGES
      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output